name: Build SkillTree
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "SkillTree/SkillTree"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: SkillTree
          path: "SkillTree/SkillTree/target/SkillTree-1.0.jar"
